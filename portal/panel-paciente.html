<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi atención | San Juan de Dios</title>

    <link
        rel="stylesheet"
        href="../css/portal.css"
    >

    <style>

        .portal-panel {
            width: min(900px, calc(100% - 30px));
            margin: auto;
            padding: 45px 0 80px;
        }

        .portal-welcome {
            margin-bottom: 25px;
        }

        .portal-welcome span {
            color: var(--portal-primary);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.3px;
        }

        .portal-welcome h1 {
            margin: 7px 0;
            color: var(--portal-dark);
            font-size: 30px;
        }

        .portal-welcome p {
            color: var(--portal-muted);
            font-size: 12px;
        }

        .appointment-card {
            padding: 28px;
            background: white;
            border: 1px solid var(--portal-border);
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(23,49,58,.08);
        }

        .appointment-label {
            color: var(--portal-primary);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.2px;
        }

        .appointment-card h2 {
            margin: 8px 0 20px;
            color: var(--portal-dark);
            font-family: var(--portal-title);
            font-size: 24px;
        }

        .appointment-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .appointment-item {
            padding: 16px;
            background: #f7fafb;
            border-radius: 12px;
        }

        .appointment-item span,
        .appointment-item strong {
            display: block;
        }

        .appointment-item span {
            margin-bottom: 5px;
            color: var(--portal-muted);
            font-size: 9px;
            font-weight: 700;
        }

        .appointment-item strong {
            color: var(--portal-dark);
            font-size: 13px;
        }

        .portal-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .portal-action {
            padding: 11px 15px;
            color: var(--portal-primary);
            background: var(--portal-light);
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
        }

        .portal-action.logout {
            color: #a23a31;
            background: #fff0ee;
            border: 0;
            cursor: pointer;
        }

        @media (max-width: 600px) {

            .appointment-grid {
                grid-template-columns: 1fr;
            }

            .portal-panel {
                padding-top: 30px;
            }

        }

    </style>

</head>

<body class="portal-body">

<header class="portal-header">

    <a
        href="../index.html"
        class="portal-brand"
    >

        <div class="portal-logo">
            ✚
        </div>

        <div>
            <strong>
                San Juan de Dios
            </strong>

            <span>
                Portal del paciente
            </span>
        </div>

    </a>


    <button
        class="portal-back logout"
        id="logoutButton"
        type="button"
    >
        Cerrar sesión
    </button>

</header>


<main class="portal-panel">

    <section class="portal-welcome">

        <span>
            INFORMACIÓN DE ATENCIÓN
        </span>

        <h1>
            Tu próxima atención
        </h1>

        <p>
            Aquí encontrarás solamente los datos necesarios
            para acudir a tu cita.
        </p>

    </section>


    <section class="appointment-card">

        <span class="appointment-label">
            CITA PROGRAMADA
        </span>

        <h2 id="specialty">
            Medicina General
        </h2>


        <div class="appointment-grid">

            <div class="appointment-item">

                <span>
                    MÉDICO
                </span>

                <strong id="doctor">
                    Dr. Carlos Pérez
                </strong>

            </div>


            <div class="appointment-item">

                <span>
                    FECHA
                </span>

                <strong id="date">
                    30/09/2026
                </strong>

            </div>


            <div class="appointment-item">

                <span>
                    HORA
                </span>

                <strong id="time">
                    09:00 a. m.
                </strong>

            </div>


            <div class="appointment-item">

                <span>
                    UBICACIÓN
                </span>

                <strong id="location">
                    Puerta 3
                </strong>

            </div>

        </div>


        <div class="portal-actions">

            <a
                href="especialidades.html"
                class="portal-action"
            >
                Ver especialidades
            </a>

            <button
                id="logoutButtonBottom"
                class="portal-action logout"
                type="button"
            >
                Cerrar sesión
            </button>

        </div>

    </section>

</main>


<script>

document.addEventListener("DOMContentLoaded", () => {

    const data =
        sessionStorage.getItem("sjdd_patient");

    if (!data) {

        window.location.href =
            "portal-paciente.html";

        return;
    }


    const patient =
        JSON.parse(data);


    document.getElementById("specialty")
        .textContent =
        patient.cita.especialidad;

    document.getElementById("doctor")
        .textContent =
        patient.cita.medico;

    document.getElementById("date")
        .textContent =
        patient.cita.fecha;

    document.getElementById("time")
        .textContent =
        patient.cita.hora;

    document.getElementById("location")
        .textContent =
        patient.cita.ubicacion;


    function logout() {

        sessionStorage.removeItem(
            "sjdd_patient"
        );

        window.location.href =
            "portal-paciente.html";

    }


    document
        .getElementById("logoutButton")
        .addEventListener(
            "click",
            logout
        );


    document
        .getElementById("logoutButtonBottom")
        .addEventListener(
            "click",
            logout
        );

});

</script>

</body>
</html>
